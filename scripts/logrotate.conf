# logrotate — Defumados AC
# Copie para: /etc/logrotate.d/defumadosac
# Depois: sudo logrotate -f /etc/logrotate.d/defumadosac (teste)
# O logrotate roda automaticamente pelo cron diário do sistema.

/home/deploy/defumados-loja/app.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y-%m-%d
    maxsize 50M
}
