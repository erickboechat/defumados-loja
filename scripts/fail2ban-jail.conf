# Fail2ban — Defumados AC
# Copie para /etc/fail2ban/jail.d/defumadosac.local
# Depois: sudo fail2ban-client reload
#
# Requer fail2ban instalado: sudo apt install fail2ban
# E o Nginx configurado com set_real_ip_from Cloudflare (já está).

[defumadosac-login]
enabled  = true
port     = http,https
filter   = defumadosac-login
logpath  = /home/deploy/defumados-loja/app.log
maxretry = 5
bantime  = 3600
findtime = 600
