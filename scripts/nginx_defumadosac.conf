# Nginx — Defumados AC (Cloudflare Flexible SSL)
# Cloudflare faz o SSL externamente; o Nginx escuta apenas HTTP na porta 80.
#
# Copie para /etc/nginx/sites-available/defumadosac.com.br
# Depois: sudo ln -s /etc/nginx/sites-available/defumadosac.com.br /etc/nginx/sites-enabled/ (se não existir)
# Depois: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name defumadosac.com.br www.defumadosac.com.br;

    # Tamanho máximo do upload (para imagens de produtos)
    client_max_body_size 20M;

    # Confiar no IP real do cliente via Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Arquivos estáticos — cache longo (cache busting via ?v= nos URLs)
    location /static/ {
        alias /home/deploy/defumados-loja/static/;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    location /uploads/ {
        alias /home/deploy/defumados-loja/static/uploads/;
        add_header Cache-Control "public, immutable, max-age=2592000";
        access_log off;
    }

    location /imagens/ {
        alias /home/deploy/defumados-loja/public/imagens/;
        add_header Cache-Control "public, immutable, max-age=2592000";
        access_log off;
    }

    # Proxy reverso para o Flask (via Waitress)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
