# Nginx — Defumados AC
# Copie para /etc/nginx/sites-available/defumadosac.com.br
# Depois: sudo ln -s /etc/nginx/sites-available/defumadosac.com.br /etc/nginx/sites-enabled/
# Depois: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name defumadosac.com.br www.defumadosac.com.br;

    # Redirecionar HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name defumadosac.com.br www.defumadosac.com.br;

    # SSL — gere com Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/defumadosac.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/defumadosac.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Tamanho máximo do upload (para imagens de produtos)
    client_max_body_size 20M;

    # Arquivos estáticos — servidos diretamente pelo Nginx (mais rápido)
    location /static/ {
        alias /home/deploy/defumados-loja/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        alias /home/deploy/defumados-loja/static/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /imagens/ {
        alias /home/deploy/defumados-loja/public/imagens/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso para o Flask (via Waitress)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
