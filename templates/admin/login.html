<!DOCTYPE html>
<html lang="pt-BR" class="admin-body">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin | Defumados AC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.min.css') }}?v={{ static_version }}">
  <link rel="icon" type="image/png" href="/static/uploads/logo-1.png">
</head>
<body class="admin-login-page">
  <div class="login-box">
    <h2>🔐 Acesso Administrativo</h2>
    {% if erro %}
    <div class="login-error">{{ erro }}</div>
    {% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="username" placeholder="Usuário" class="admin-input" required>
      <input type="password" name="password" placeholder="Senha" class="admin-input" required>
      <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;">Entrar</button>
    </form>
    <a href="/" style="display:block;text-align:center;margin-top:16px;color:var(--admin-text-secondary);text-decoration:none;font-size:14px;">← Voltar para a loja</a>
  </div>
</body>
</html>
