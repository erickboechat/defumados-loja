{% extends 'base.html' %}
{% block title %}Requisição inválida - Defumados AC{% endblock %}
{% block content %}
<main class="page-institucional" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 2rem;">
  <div>
    <h1 style="font-size:5rem;color:var(--cor-primaria);margin:0;">400</h1>
    <h2 style="color:#333;margin:0.5rem 0 1rem;">Requisição inválida</h2>
    <p style="color:#666;max-width:400px;margin:0 auto 2rem;">{% if mensagem %}{{ mensagem }}{% else %}Algo deu errado com sua solicitação. Por favor, tente novamente.{% endif %}</p>
    <a href="javascript:history.back()" class="btn-primary" style="display:inline-block;padding:0.8rem 2rem;margin-right:0.5rem;">← Voltar</a>
    <a href="/" class="btn-primary" style="display:inline-block;padding:0.8rem 2rem;background:#666;">Ir para Loja</a>
  </div>
</main>
{% endblock %}
