<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Defumados AC{% endblock %}</title>
  <meta name="description" content="{% block meta_desc_content %}Defumados AC - Defumados artesanais de porco em Vargem Grande, Rio de Janeiro. Linguiças, bacon, copa, costelinha e mais.{% endblock %}">
  <link rel="canonical" href="{% block canonical_url %}https://defumadosac.com.br/{% endblock %}">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="/static/uploads/logo-1.png">
  {% if critical_css %}
  <style>{{ critical_css }}</style>
  {% endif %}
  <link rel="preload" href="{{ url_for('static', filename='style.min.css') }}?v={{ static_version }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="{{ url_for('static', filename='style.min.css') }}?v={{ static_version }}"></noscript>
  {% block og_tags %}{% endblock %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}Defumados AC{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_desc %}Defumados artesanais de porco em Vargem Grande, RJ{% endblock %}">
  <meta name="twitter:image" content="{% block twitter_image %}https://defumadosac.com.br/static/uploads/logo-1.png{% endblock %}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FoodEstablishment",
    "name": "Defumados Arcos Carballiño",
    "description": "Defumados artesanais de porco em Vargem Grande, Rio de Janeiro",
    "url": "https://defumadosac.com.br",
    "logo": "https://defumadosac.com.br/static/uploads/logo-1.png",
    "image": "https://defumadosac.com.br/static/uploads/logo-1.png",
    "telephone": "+5521986358184",
    "email": "defumadosac@outlook.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Rio de Janeiro",
      "addressRegion": "RJ",
      "addressCountry": "BR"
    },
    "sameAs": [
      "https://www.instagram.com/defumadosac",
      "https://api.whatsapp.com/send?phone=5521986358184"
    ],
    "priceRange": "$$"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://defumadosac.com.br/#website",
    "name": "Defumados Arcos Carballiño",
    "url": "https://defumadosac.com.br",
    "description": "Defumados artesanais de porco em Vargem Grande, Rio de Janeiro",
    "inLanguage": "pt-BR",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://defumadosac.com.br/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'header.html' %}
  {% block content %}{% endblock %}
  {% include 'footer.html' %}
</body>
</html>
